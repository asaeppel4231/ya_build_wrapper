#AI generated

name: Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-arm64:
    runs-on: linux-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        run: |
          sudo apt update
          sudo apt install ccache libfuse-dev python3-pip python3-yaml -y

      - name: Install Nuitka and Zstandard
        run: |
          python3 -m pip install --upgrade pip
          pip install nuitka zstandard rich --break-system-packages || pip install nuitka zstandard rich

      - name: Compile with Nuitka
        working-directory: ./src
        run: |
          python3 -m nuitka --onefile --standalone --include-data-dir=examples=examples -o ../ya_build_wrp_linux_arm64.bin builder.py --assume-yes-for-downloads

      - name: Upload Binary to Forgejo Release
        run: |
          echo "Uploading asset to Forgejo Release..."
          
          AUTH_HEADER="Authorization: token ${{ secrets.FORGEJO_TOKEN }}"
          
          # 1. Ermitteln der Release-ID anhand des aktuellen System-Tags
          RELEASE_ID=$(curl -s -H "$AUTH_HEADER" \
            "${GITEA_API_URL}/api/v1/repos/${GITEA_REPOSITORY}/releases/tags/${GITEA_REF_NAME}" \
            | jq '.id')
          
          echo "Found Forgejo Release ID: ${RELEASE_ID}"
          
          curl -X POST \
            -H "$AUTH_HEADER" \
            -H "accept: application/json" \
            -H "Content-Type: multipart/form-data" \
            -F "attachment=@ya_build_wrp_linux_arm64.bin" \
            "${GITEA_API_URL}/api/v1/repos/${GITEA_REPOSITORY}/releases/${RELEASE_ID}/assets?name=ya_build_wrapper_linux_arm64"

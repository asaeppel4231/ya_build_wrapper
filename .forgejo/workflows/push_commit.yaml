# AI generated

name: Check code quality

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  qa:
    runs-on: linux-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run SCC
        run: |
          scc src/ # scc is already installed

      # Dependencies already installed
      - name: Run Tests with Pytest Coverage
        run: |
          pytest --cov=src --cov-report=term-missing || true

      # Dependencies already installed
      - name: Run Interrogate Documentation Check
        run: |
          interrogate src -v || true

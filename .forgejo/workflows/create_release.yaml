# AI generated

name: Release

on:
  push:
    tags:
      - 'v*'
      - 'workflow_test_*'

permissions:
  contents: write

jobs:
  build-arm64:
    runs-on: linux-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile with Nuitka
        working-directory: ./src
        run: |
          python3 -m nuitka --onefile --standalone --include-data-dir=../examples=examples -o ../ya_build_wrp_linux_arm64.bin builder.py --assume-yes-for-downloads

      - name: Create or Update Forgejo Release & Upload Asset
        run: |
          echo "Processing Forgejo Release Automation..."
          
          AUTH_HEADER="Authorization: token ${{ secrets.FORGEJO_TOKEN }}"
          
          TAG_NAME="${{ forgejo.ref_name }}"
          echo "Target Tag: ${TAG_NAME}"
          
          RELEASE_CHECK=$(curl -s -o /dev/null -w "%{http_code}" -H "$AUTH_HEADER" \
            "${GITEA_API_URL}/api/v1/repos/${GITEA_REPOSITORY}/releases/tags/${TAG_NAME}")
          
          if [ "$RELEASE_CHECK" != "200" ]; then
            echo "Release for ${TAG_NAME} does not exist yet. Creating it via API..."
            curl -s -X POST \
              -H "$AUTH_HEADER" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\": \"${TAG_NAME}\", \"name\": \"Version ${TAG_NAME}\", \"body\": \"Automated binary build for ${TAG_NAME}\", \"draft\": false, \"prerelease\": false}" \
              "${GITEA_API_URL}/api/v1/repos/${GITEA_REPOSITORY}/releases"
          else
            echo "Release for ${TAG_NAME} already exists."
          fi
          
          RELEASE_ID=$(curl -s -H "$AUTH_HEADER" \
            "${GITEA_API_URL}/api/v1/repos/${GITEA_REPOSITORY}/releases/tags/${TAG_NAME}" \
            | jq '.id')
          
          echo "Target Forgejo Release ID: ${RELEASE_ID}"
          
          curl -X POST \
            -H "$AUTH_HEADER" \
            -H "accept: application/json" \
            -H "Content-Type: multipart/form-data" \
            -F "attachment=@ya_build_wrp_linux_arm64.bin" \
            "${GITEA_API_URL}/api/v1/repos/${GITEA_REPOSITORY}/releases/${RELEASE_ID}/assets?name=ya_build_wrapper_linux_arm64.bin"
          
          echo "Asset successfully uploaded!"

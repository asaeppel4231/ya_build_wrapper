# AI generated

name: Release

on:
  push:
    tags:
      - 'v*'
      - 'workflow_test_*'

permissions:
  contents: write

jobs:
  build-arm64:
    runs-on: linux-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile with Nuitka
        run: |
          python3 -m nuitka --onefile --standalone --include-data-dir=examples=examples -o ya_build_wrp_linux_arm64.bin src/builder.py --assume-yes-for-downloads

      - name: Create or Update Forgejo Release & Upload Asset
        run: |
          echo "=================================================="
          echo "🚀 STARTING FORGEJO RELEASE AUTOMATION SCRIPT"
          echo "=================================================="
          
          TAG_NAME="${{ forgejo.ref_name }}"
          REPO_NAME="${{ forgejo.repository }}"
          
          API_URL="${{ forgejo.server_url }}"
          
          echo "🔍 DEBUG: Target Tag from context is: '${TAG_NAME}'"
          echo "🔍 DEBUG: Forgejo API URL is:        '${API_URL}'"
          echo "🔍 DEBUG: Forgejo Repository is:     '${REPO_NAME}'"
          
          AUTH_HEADER="Authorization: token ${{ secrets.FORGEJO_TOKEN }}"
          
          if [ -z "${TAG_NAME}" ] || [ -z "${API_URL}" ] || [ -z "${REPO_NAME}" ]; then
            echo "❌ ERROR: One of the core variables is empty! Aborting."
            exit 1
          fi

          echo "--------------------------------------------------"
          echo "📋 STEP 1: CHECKING IF RELEASE ALREADY EXISTS"
          echo "--------------------------------------------------"
          
          TARGET_URL="${API_URL}/api/v1/repos/${REPO_NAME}/releases/tags/${TAG_NAME}"
          echo "📡 DEBUG: Sending GET request to: ${TARGET_URL}"
          
          RELEASE_CHECK=$(curl -s -o /dev/null -w "%{http_code}" -H "$AUTH_HEADER" "${TARGET_URL}")
          echo "📥 DEBUG: Forgejo API responded with HTTP Status Code: ${RELEASE_CHECK}"
          
          if [ "$RELEASE_CHECK" != "200" ]; then
            echo "➕ INFO: Release for tag '${TAG_NAME}' does not exist yet (Status ${RELEASE_CHECK})."
            echo "➕ INFO: Creating new release via Forgejo API..."
            
            echo "🛠️ DEBUG: Building JSON Payload using jq..."
            JSON_DATA=$(jq -n \
              --arg tag "$TAG_NAME" \
              --arg name "Version $TAG_NAME" \
              --arg body "Automated binary build for $TAG_NAME" \
              '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false}')
            
            CREATE_URL="${API_URL}/api/v1/repos/${REPO_NAME}/releases"
            echo "📡 DEBUG: Sending POST request to: ${CREATE_URL}"
            
            CREATE_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
              -H "$AUTH_HEADER" \
              -H "Content-Type: application/json" \
              -d "$JSON_DATA" \
              "${CREATE_URL}")
            
            echo "📥 DEBUG: Raw API Response from Release Creation: ${CREATE_RESPONSE}"
          else
            echo "✅ INFO: Release for tag '${TAG_NAME}' already exists (Status 200). Skipping creation."
          fi
          
          echo "--------------------------------------------------"
          echo "🆔 STEP 2: FETCHING RELEASE ID FROM FORGEJO"
          echo "--------------------------------------------------"
          
          echo "📡 DEBUG: Fetching tag data again to parse ID..."
          RAW_TAG_DATA=$(curl -s -H "$AUTH_HEADER" "${TARGET_URL}")
          
          RELEASE_ID=$(echo "${RAW_TAG_DATA}" | jq '.id' 2>/dev/null)
          echo "🆔 DEBUG: Parsed Release ID is: '${RELEASE_ID}'"
          
          if [ "$RELEASE_ID" = "null" ] || [ -z "$RELEASE_ID" ]; then
            echo "❌ ERROR: Failed to fetch a valid numerical Release ID from Forgejo API!"
            exit 1
          fi
          
          echo "--------------------------------------------------"
          echo "📦 STEP 3: UPLOADING NATIVE ARM64 BINARY ASSET"
          echo "--------------------------------------------------"
          
          UPLOAD_URL="${API_URL}/api/v1/repos/${REPO_NAME}/releases/${RELEASE_ID}/assets?name=ya_build_wrapper_linux_arm64.bin"
          echo "📡 DEBUG: Uploading file to target URL: ${UPLOAD_URL}"
          
          UPLOAD_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "$AUTH_HEADER" \
            -H "accept: application/json" \
            -H "Content-Type: multipart/form-data" \
            -F "attachment=@ya_build_wrp_linux_arm64.bin" \
            "${UPLOAD_URL}")
          
          echo "📥 DEBUG: Raw API Response from Asset Upload: ${UPLOAD_RESPONSE}"
          echo "=================================================="
          echo "🎉 SUCCESS: Asset successfully processed!"
          echo "=================================================="

